spring:
  application:
    name: campus-flow

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

mybatis:
  configuration:
    # 生产环境建议改为 org.apache.ibatis.logging.slf4j.Slf4jImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

jwt:
  # 生产环境必须通过环境变量覆盖，默认值仅用于本地开发
  secret: ${JWT_SECRET:campus-flow-dev-secret-please-change-in-production-2026}
  # 令牌有效期：12 小时
  expire: ${JWT_EXPIRE:43200000}

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket-name: ${OSS_BUCKET_NAME:}
    region: ${OSS_REGION:cn-hangzhou}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
